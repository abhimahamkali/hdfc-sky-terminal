<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_shared.css"></head>
<body><div class="ds-card">
  <div class="ds-row">
    <span class="tag tag--loss">EXPIRY TODAY</span>
    <span class="tag tag--profit">LONG BUILDUP</span>
    <span class="tag tag--info">NEW</span>
    <span class="tag tag--warn">EXPIRING</span>
    <span class="tag" style="background:#F3F4FC;color:#2850E7">NSE</span>
    <span class="tag" style="background:#F3F4FC;color:#2850E7">BSE</span>
  </div>
  <div class="ds-row" style="margin-top:6px">
    <div style="display:inline-flex;align-items:center;gap:6px;background:#FEF3F2;color:#F04438;padding:4px 8px;border-radius:4px;font-family:var(--font-data);font-weight:700;font-size:11px">ⓘ MARKET CLOSED</div>
    <div style="display:inline-flex;align-items:center;gap:6px;background:#ECFDF3;color:#039855;padding:4px 8px;border-radius:4px;font-family:var(--font-data);font-weight:700;font-size:11px">ⓘ LIVE</div>
  </div>
  <div class="meta">Tag fills are washed-out tints of the same hue family — never saturated. Always uppercase, 10–11px micro size.</div>
</div></body></html>
