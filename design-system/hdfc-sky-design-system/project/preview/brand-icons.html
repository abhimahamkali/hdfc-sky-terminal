<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_shared.css">
<style>
  .icon-grid { display:grid;grid-template-columns:repeat(5, 1fr);gap:16px }
  .icon-cell { display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;border:1px solid #DDE0F1;border-radius:8px;background:#fff }
  .icon { width:24px;height:24px;background-color:#2850E7;-webkit-mask-position:center;mask-position:center;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain }
  .icon-cell span { font-family:var(--font-data);font-size:11px;color:#68697E }
</style></head>
<body><div class="ds-card">
  <div class="icon-grid">
    <div class="icon-cell"><div class="icon" style="-webkit-mask-image:url(../assets/icons/chart.svg);mask-image:url(../assets/icons/chart.svg)"></div><span>chart</span></div>
    <div class="icon-cell"><div class="icon" style="-webkit-mask-image:url(../assets/icons/option-chain.svg);mask-image:url(../assets/icons/option-chain.svg)"></div><span>option-chain</span></div>
    <div class="icon-cell"><div class="icon" style="-webkit-mask-image:url(../assets/icons/scales.svg);mask-image:url(../assets/icons/scales.svg)"></div><span>scales · scalper</span></div>
    <div class="icon-cell"><div class="icon" style="-webkit-mask-image:url(../assets/icons/open-interest.svg);mask-image:url(../assets/icons/open-interest.svg)"></div><span>open-interest</span></div>
    <div class="icon-cell"><div class="icon" style="-webkit-mask-image:url(../assets/icons/straddle.svg);mask-image:url(../assets/icons/straddle.svg)"></div><span>straddle</span></div>
    <div class="icon-cell"><div class="icon" style="-webkit-mask-image:url(../assets/icons/depth.svg);mask-image:url(../assets/icons/depth.svg)"></div><span>depth</span></div>
    <div class="icon-cell"><div class="icon" style="-webkit-mask-image:url(../assets/icons/clock.svg);mask-image:url(../assets/icons/clock.svg)"></div><span>clock · pomodoro</span></div>
    <div class="icon-cell"><div class="icon" style="-webkit-mask-image:url(../assets/icons/youtube.svg);mask-image:url(../assets/icons/youtube.svg)"></div><span>youtube</span></div>
    <div class="icon-cell"><div class="icon" style="-webkit-mask-image:url(../assets/icons/calculator.svg);mask-image:url(../assets/icons/calculator.svg)"></div><span>calculator</span></div>
    <div class="icon-cell"><div class="icon" style="-webkit-mask-image:url(../assets/icons/filter.svg);mask-image:url(../assets/icons/filter.svg)"></div><span>filter</span></div>
  </div>
  <div class="meta">Outline icons · 1.5 px stroke · 24×24 frame · always rendered in brand blue (#2850E7). Tinted via CSS mask so a single SVG works across any theme color.</div>
</div></body></html>
